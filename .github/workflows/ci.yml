name: CI

# The mechanical half of code review.
#
# Everything here is a rule a machine can decide: does it compile, does it lint,
# do the tests pass. A rule enforced here fails in seconds with a file and a
# line number, and the author fixes it alone. The same rule left to a reviewer
# costs a rejection, a full rewrite, and one of the fix attempts a story gets
# before it ships nothing.
#
# This file was missing for a while, and the cost is measurable. The scaffold
# prompt told the architect to write it, but .github/ is write-protected
# (see internal/security/path.go — a workflow can publish the image the
# deployer runs, so agents may read it and never write it). Both attempts
# failed, and the architect then recorded "ci.workflow: .github/workflows/ci.yml"
# as a fact about a file that did not exist.
#
# What made it hard to see is that CI was not silent. container.yml ran on every
# pull request and passed, so the pipeline reported "CI passed" and was telling
# the truth — about whether the image builds and boots, which was the only thing
# being asked. No lint, no vet, no unit tests, no token check existed anywhere.
#
# All of those rules fell to the reviewer's eyes instead. One story's backend was
# reviewed 22 times and rebuilt 19 times over an error envelope, a health-check
# timeout, an unhandled query parameter and a status code — every one of them
# something a test would have caught before a reviewer ever read the diff.
#
# Jobs are guarded on the directory they test, because the scaffold lands
# before the code it scaffolds and a project may legitimately have no frontend
# or no backend. Skipping is the honest result for a commit with nothing to
# check; failing would make every early PR red for a reason no author can fix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: What is here?
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Look for each half
        id: check
        run: |
          if [ -f code/backend/go.mod ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code/backend/go.mod — skipping backend checks."
          fi
          if [ -f code/frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code/frontend/package.json — skipping frontend checks."
          fi

  backend:
    name: Backend
    needs: guard
    if: needs.guard.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/backend/go.mod
          cache-dependency-path: code/backend/go.sum
      # Before build: a hand-written go.sum passes `go build` from cache on one
      # machine and fails on a clean runner, which is the confusing half of this.
      - name: Dependencies are complete
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    needs: guard
    if: needs.guard.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Said here, in words, because setup-node does not say it.
      #
      # Its cache step resolves cache-dependency-path before anything else runs,
      # and a missing lock file fails the job with "Some specified paths were not
      # resolved, unable to cache dependencies" — which reads like a runner
      # problem and sends the author looking at caching. The real cause is a
      # frontend committed without its lock file, and the fix is one command.
      #
      # Failing is correct: npm ci cannot run without it. Only the message was
      # wrong, and a confusing error is expensive here — a story has a fixed
      # number of fix attempts and spends one on every round it misreads.
      # The path is relative to code/frontend: every `run` in this job starts
      # there (defaults.run above). Written from the repository root it tested
      # code/frontend/code/frontend/package-lock.json, which never exists, and
      # failed every scaffold with the lock file committed — two acceptance
      # runs spent all three scaffold fixes on it. `with:` paths below are not
      # affected; they resolve from the repository root.
      - name: Lock file is committed
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "::error::code/frontend/package-lock.json is missing. The frontend cannot be built or cached without it: npm ci installs from the lock file and refuses to run when it is absent. Run 'npm install' in code/frontend and commit the package-lock.json it writes, alongside package.json."
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      # `npm ci` and not `npm install`: it fails loudly when package-lock.json
      # disagrees with package.json, which is the whole reason the lock file is
      # committed.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # --if-present, because a project may have no tests yet and a missing
      # script should not be reported as a failing one.
      - name: Test
        run: npm test --if-present

  # The design system is a set of rules about CSS, so it is checkable like any
  # other. A hardcoded colour renders perfectly and is invisible in review until
  # someone compares two screens; an undefined custom property renders as
  # nothing at all, with no error anywhere.
  tokens:
    name: Design tokens
    needs: guard
    if: needs.guard.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: No hardcoded visual values in CSS modules
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(code/frontend/**/*.module.css)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::No CSS modules yet."
            exit 0
          fi
          # Hex colours, rgb()/rgba() literals, and px lengths outside a
          # var(). Borders and hairlines of 0-2px are exempt: they are not
          # spacing decisions and the design system does not tokenise them.
          #
          # The length branch reads `([3-9]|[0-9]{2,})px` — one digit from 3 up,
          # or any number of two digits or more — and not the `[3-9][0-9]*px` it
          # used to, which asked for a FIRST digit of 3-9 and so exempted every
          # value that merely started with a 1 or a 2. `padding: 24px` and
          # `width: 250px` sailed through a job whose whole purpose was to stop
          # them. The exemption belongs to values below 3px, not to values whose
          # leading digit is small.
          #
          # It is a matter for the pattern rather than the filter below, because
          # a line-level exemption pardons the whole line: `border: 1px solid
          # #ff0000` would have bought its hardcoded hex an amnesty with a
          # hairline.
          #
          # Two more are exempt for the same reason. A media query cannot hold a
          # token at all — CSS does not expand var() in a feature value — so
          # `@media (max-width: 479px)` was a rule no author could satisfy, and
          # the author who met it deleted the breakpoint rather than tokenise
          # it. A length inside min()/max()/clamp() is a layout bound and not a
          # spacing step: `width: min(760px, 100%)` says how wide the element
          # may grow, which the design system does not tokenise either.
          #
          # Measured on one Hello World story: three of its five fix attempts
          # went to these two false positives, and the story came within one
          # attempt of shipping nothing over a grep.
          #
          # Those exemptions are applied by ERASING the expression before the
          # match, not by pardoning the line that holds it — which is the same
          # lesson as the px branch above, learned twice. `var(--` used to sit
          # in a line-level `grep -v`, so any hardcoded value sharing a line
          # with any token was invisible: this shipped
          #
          #   background: linear-gradient(180deg, #3b82f6 0%, var(--color-primary-hover) 100%);
          #
          # through a green run of the job built to stop it, and #3b82f6 was not
          # even in the palette. Gradients, shadows and borders are exactly the
          # declarations that mix tokens with literals, so the hole covered the
          # cases that matter most. Erasing var()/min()/max()/clamp() leaves the
          # token expression unmatched and every literal beside it exposed.
          offenders=$(
            for f in "${files[@]}"; do
              sed -E 's/\b(var|min|max|clamp)\([^)]*\)/TOKENEXPR/g' "$f" \
                | grep -nE '(#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)|(^|[^-a-zA-Z0-9.])([3-9]|[0-9]{2,})px)' \
                | sed "s|^|$f:|"
            done | grep -vE '@media' || true
          )
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::Hardcoded colour or length in a CSS module. Use a token from app/globals.css."
            exit 1
          fi
      # A fallback is the literal that ships whenever the token is missing, and
      # the step above cannot see it: it erases the whole var(...) before
      # matching, fallback included. Authors and reviewers were both told CI
      # catches `var(--space-4, 16px)`; until this step, it did not.
      - name: No var() fallbacks in CSS modules
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(code/frontend/**/*.module.css)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          offenders=$(grep -nE 'var\(--[A-Za-z0-9_-]+[[:space:]]*,' "${files[@]}" /dev/null || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::var() with a fallback in a CSS module. The fallback ships whenever the token is missing — write var(--token) alone."
            exit 1
          fi
      # The palette has to be CHOSEN, not inherited.
      #
      # The scaffold used to ship a finished cream-and-clay palette, and three
      # designs in a row kept it: a golf club, a coffee roastery and an audio
      # shop, one of them byte for byte and the other two within a few per
      # cent. Nothing was wrong with the colours except that nobody chose
      # them — a default good enough to ship is the strongest anchor there is,
      # because changing it is risk with no reward.
      #
      # So it ships a placeholder marked UNSET, and this is the step that
      # means it. It costs nothing on a design that chose.
      #
      # Pull requests only. The scaffold is pushed to main with the
      # placeholder still in it — that push is the project being created, not
      # a design being proposed — and failing it would paint every new
      # project red before anyone had designed anything.
      - name: The design chose its own palette
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          tokens=code/frontend/src/theme.css
          [ -f "$tokens" ] || tokens=code/frontend/app/globals.css
          [ -f "$tokens" ] || exit 0
          left=$(grep -nE 'UNSET' "$tokens" || true)
          if [ -n "$left" ]; then
            echo "::error file=$tokens::The palette is still the scaffold's placeholder. Every value marked UNSET is this business's to choose — the colours and the two faces — and the UNSET marker goes with it."
            echo "$left"
            exit 1
          fi
      # A token that is never defined renders as NOTHING — silently. The
      # property computes to empty, the browser shows whatever the fallback
      # cascade gives it, and no error appears anywhere. A reviewer caught one
      # of these by eye ("uses non-existent design tokens") while this job sat
      # green, which is one round of review and one rebuild for a diff a grep
      # answers in a second.
      - name: Every used token is defined
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(code/frontend/**/*.css)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          used=$(grep -rhoE 'var\(--[a-z0-9-]+' "${files[@]}" | sed 's/var(//' | sort -u)
          if [ -z "$used" ]; then exit 0; fi
          # One of the two files is always absent, and under set -e a grep that
          # cannot open a file fails the assignment with exit 2 and no message.
          defined=$( (grep -hoE '^[[:space:]]*--[a-z0-9-]+' code/frontend/app/globals.css code/frontend/src/theme.css 2>/dev/null || true) | tr -d ' ' | sort -u)
          missing=$(comm -23 <(echo "$used") <(echo "$defined") || true)
          if [ -n "$missing" ]; then
            echo "::error::Tokens used but never defined in the token stylesheet (app/globals.css or src/theme.css) — they render as nothing, silently:"
            echo "$missing"
            exit 1
          fi
      # globals.css is not the source of truth — design/design-system.md says so
      # itself, in its own header. This step is why that sentence has teeth.
      #
      # Measured: CI passed a module at 12:22:23 and a reviewer blocked the same
      # file 26 seconds later for "non-existent design tokens". Both were right.
      # The design system defined `--text-base`; globals.css had expanded it into
      # `--text-base-size`, `--text-base-weight`, `--text-base-line-height`; the
      # check above validated against globals.css and so certified the drift the
      # reviewer then rejected. The machine gate and the human gate were reading
      # different documents.
      - name: Defined tokens trace to the design system
        run: |
          set -euo pipefail
          ds=design/design-system.md
          # Tokens live in app/globals.css on a Next.js frontend and in
          # src/theme.css on one designed in code (Vite + React); either is
          # the token file, and a project has exactly one of them.
          tokens=code/frontend/app/globals.css
          [ -f "$tokens" ] || tokens=code/frontend/src/theme.css
          if [ ! -f "$ds" ] || [ ! -f "$tokens" ]; then
            echo "::notice::No design system or no token stylesheet yet."
            exit 0
          fi
          defined=$( (grep -hoE '^[[:space:]]*--[a-z0-9-]+' "$tokens" || true) | tr -d ' ' | sort -u)
          approved=$(grep -hoE '\-\-[a-z0-9-]+' "$ds" | sort -u)
          stray=$(comm -23 <(echo "$defined") <(echo "$approved") || true)
          if [ -n "$stray" ]; then
            # A warning, not a failure, and the reason is a rule this repository
            # keeps re-learning: a gate the author cannot pass is a blocker.
            #
            # Failing here traps the author between two steps. The step above
            # requires every USED token to be defined in globals.css; this one
            # requires every DEFINED token to appear in the design system. An
            # author who needs a token the design system lacks — run 8 needed
            # --viewport-height — can then only escape by editing the design
            # system itself, which that document forbids in its own header:
            # changing a value there without changing the approved design is a
            # defect. Both doors locked is not enforcement, it is a trap.
            #
            # So the drift is reported where the reviewer and the author both
            # read it, and the decision — widen the design system, or stop using
            # the token — stays with the people who may actually make it.
            echo "::warning::These tokens are defined in app/globals.css but appear nowhere in $ds, which calls itself the source of truth. Either the design system should name them, or the CSS should not use them — decide it deliberately rather than letting the two documents drift:"
            echo "$stray"
          fi
      # `var(--space-4, 16px)` is a hardcoded value wearing a token's clothes:
      # it renders as 16px whenever the token is undefined, so the mistake it
      # is meant to guard against becomes invisible instead of loud.
      - name: No token fallbacks
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(code/frontend/**/*.css)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          if grep -nE 'var\(--[a-zA-Z0-9-]+,' "${files[@]}"; then
            echo "::error::var(--token, fallback) hides an undefined token. Define the token instead."
            exit 1
          fi

  # Is the product wired to its own API, or still to the fixtures?
  #
  # A story shipped on the Hello World run with all six of its cases passing,
  # and the page a user opened rendered mock data. The component the story built
  # was merged, reviewed and never mounted; the API held two greetings while the
  # page said "No greetings yet". Nothing in the pipeline compares what was
  # built against what the page actually renders, so every status was green.
  #
  # Three of these are WARNINGS, not failures, and the reason matters: the
  # intended flow ships the UI against mock data in one pull request and
  # replaces it with the API in a second one. Failing on a mock import would
  # turn every legitimate UI pull request red. What was missing was never
  # enforcement at this layer — it was anyone being told. A warning is visible
  # in the checks and in the diff, and the deploy-time gate in the orchestrator
  # is where a mock-backed product is actually stopped.
  #
  # The deletion check IS a failure, because it has never once been legitimate.
  # Twice on that run "remove it from the diff" was carried out as "delete the
  # file", and both times app/page.tsx went with it: an App Router project with
  # no page.tsx has no `/` route, the frontend container fails its healthcheck,
  # and the whole stack refuses to boot.
  wiring:
    name: Wired to the API?
    needs: guard
    if: needs.guard.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: the deletion check compares against the base branch.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No frontend file is deleted
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
          # A story's backend step deletes its own mock module under lib/mock/ by
          # design — that is the one frontend deletion this check allows.
          deleted=$(git diff --diff-filter=D --name-only "$base"...HEAD -- code/frontend/ ':(exclude)code/frontend/lib/mock/' || true)
          if [ -n "$deleted" ]; then
            echo "$deleted"
            echo "::error::This pull request deletes frontend files. Removing a file from a diff means restoring it to the base branch (git checkout $base -- <path>), never deleting it. Deleting app/page.tsx removes the / route and the frontend container then fails its healthcheck."
            exit 1
          fi

      - name: Mock modules still supplying the UI
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(code/frontend/**/*.ts code/frontend/**/*.tsx)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          # Importers of a mock module, not counting the mock modules themselves.
          importers=$(grep -lE "from ['\"].*(lib/)?mock/" "${files[@]}" 2>/dev/null | grep -v '/mock/' || true)
          if [ -n "$importers" ]; then
            echo "$importers"
            echo "::warning::These files still import mock data. That is expected while the UI pull request stands alone, and is a defect once the backend has landed: the deployed page will render fixtures no matter what the API holds."
          fi

      - name: Components nothing renders
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          components=(code/frontend/components/*.tsx)
          if [ ${#components[@]} -eq 0 ]; then exit 0; fi
          consumers=(code/frontend/**/*.ts code/frontend/**/*.tsx)
          orphans=""
          for path in "${components[@]}"; do
            name=$(basename "$path" .tsx)
            # Imported anywhere other than its own file?
            if ! grep -lE "(from ['\"].*/${name}['\"]|<${name}[[:space:]/>])" "${consumers[@]}" 2>/dev/null \
                 | grep -qv "^${path}$"; then
              orphans="${orphans}${path}"$'\n'
            fi
          done
          if [ -n "$orphans" ]; then
            echo "$orphans"
            echo "::warning::These components are never imported or rendered. Code that ships without being mounted was paid for twice — built and reviewed — and no user will ever see it."
          fi

      - name: One API client
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          clients=(code/frontend/lib/*api*.ts code/frontend/lib/api/*.ts)
          if [ ${#clients[@]} -le 1 ]; then exit 0; fi
          printf '%s\n' "${clients[@]}"
          echo "::warning::More than one API client module exists. Each one builds its own URLs, so a base-path fix applied to one of them silently leaves the others broken. Consolidate to a single client."
